name: Run merge gate
on:
  workflow_dispatch:
    inputs:
      pull_request:
        description: PR number to test before merging (update its branch first)
        required: true
permissions:
  contents: read
  pull-requests: read
  checks: write
concurrency:
  group: relay-merge-${{ inputs.pull_request }}
  cancel-in-progress: true
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - id: source
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pull_request }}
        shell: bash
        run: |
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]] || exit 1
          SHA=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq .head.sha)
          BASE=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq .base.sha)
          STATUS=$(gh api "repos/$GITHUB_REPOSITORY/compare/$BASE...$SHA" --jq .status)
          if [[ "$STATUS" != 'ahead' && "$STATUS" != 'identical' ]]; then
            echo 'Update the PR branch from main before running the merge gate.'
            exit 1
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
      - uses: jacobheric/railway/action@2aa26fa78be072fb47a8cd5c7d48642afef92df7
        with:
          url: ${{ vars.RELAY_URL }}
          commit: ${{ steps.source.outputs.sha }}
          pull-request: ${{ inputs.pull_request }}
          mode: firewall
          token: ${{ secrets.RELAY_AUTOMATION_TOKEN }}
