name: PR CI
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pull_request:
        description: Pull request number
        required: true
permissions:
  contents: read
  pull-requests: read
  checks: write
concurrency:
  group: acorn-pr-${{ github.event.pull_request.number || inputs.pull_request }}
  cancel-in-progress: true
jobs:
  ci:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - id: source
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pull_request }}
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]] || exit 1
          SHA=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq .head.sha)
          if [[ -n "$EVENT_HEAD" && "$SHA" != "$EVENT_HEAD" ]]; then
            echo 'This push was superseded.'
            exit 1
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
      - uses: jacobheric/acorn/action@3633c27192246895ecd7f20b804366fff1f15096
        with:
          url: ${{ vars.ACORN_URL }}
          commit: ${{ steps.source.outputs.sha }}
          pull-request: ${{ github.event.pull_request.number || inputs.pull_request }}
          mode: fallback
          token: ${{ secrets.ACORN_AUTOMATION_TOKEN }}
